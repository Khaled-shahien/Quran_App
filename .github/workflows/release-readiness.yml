name: Release identity gate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      RELEASE_ANDROID_ID: ${{ vars.RELEASE_ANDROID_ID }}
      RELEASE_IOS_ID: ${{ vars.RELEASE_IOS_ID }}
      RELEASE_FIREBASE_PROJECT: ${{ vars.RELEASE_FIREBASE_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.48.0-0.5.pre
          channel: beta
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/verify_release.py
      - run: python3 scripts/verify_content.py --require-approved
