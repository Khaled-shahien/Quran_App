name: Release identity gate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      RELEASE_ANDROID_ID: ${{ vars.RELEASE_ANDROID_ID }}
      RELEASE_IOS_ID: ${{ vars.RELEASE_IOS_ID }}
      RELEASE_FIREBASE_PROJECT: ${{ vars.RELEASE_FIREBASE_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/verify_release.py
      - run: python3 scripts/verify_content.py
