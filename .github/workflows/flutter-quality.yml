name: Flutter Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test scripts

      - name: Scan tracked files for credentials
        run: dart run scripts/check_secrets.dart

      - name: Verify religious content integrity
        run: python3 scripts/verify_content.py

      - name: Test release gate rejection and acceptance cases
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run static analysis
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub

      # Release-only bugs (R8 stripping Gson types, shrunk resources) never
      # show in debug. Build a real release APK so R8 runs on every change.
      # The key is generated here, used once and never uploaded; the APK is
      # a compile check, not a release artifact.
      - name: Create a throwaway signing key for the release build
        working-directory: android
        run: |
          keytool -genkeypair -noprompt -keystore ci-throwaway.jks \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-only -keypass ci-only -dname "CN=CI"
          printf 'storeFile=ci-throwaway.jks\nstorePassword=ci-only\nkeyAlias=ci\nkeyPassword=ci-only\n' > key.properties

      - name: Build release Android APK (runs R8)
        run: flutter build apk --release --no-pub

  visual-windows:
    name: Windows visual baselines
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/features/settings/presentation/screens/settings_golden_test.dart
