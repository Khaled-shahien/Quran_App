name: Flutter Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's default JDK (25) is newer than Gradle 8.14 supports.
      # Pin the JDK the Android build targets (JavaVersion.VERSION_17).
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test scripts

      - name: Scan tracked files for credentials
        run: dart run scripts/check_secrets.dart

      - name: Verify religious content integrity
        run: python3 scripts/verify_content.py

      - name: Test release gate rejection and acceptance cases
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run static analysis
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub --coverage

      # A report, plus floors that stop notification/background/prayer code
      # from silently losing tests. See scripts/coverage_gate.py.
      - name: Coverage report and floors
        run: python3 scripts/coverage_gate.py coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          retention-days: 14

      # Release-only bugs (R8 stripping Gson types, shrunk resources) never
      # show in debug. Build a real release APK so R8 runs on every change.
      # The key is generated here, used once and never uploaded; the APK is
      # a compile check, not a release artifact.
      - name: Create a throwaway signing key for the release build
        working-directory: android
        run: |
          keytool -genkeypair -noprompt -keystore ci-throwaway.jks \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-only -keypass ci-only -dname "CN=CI"
          printf 'storeFile=ci-throwaway.jks\nstorePassword=ci-only\nkeyAlias=ci\nkeyPassword=ci-only\n' > key.properties

      # No --no-pub here: the pub step regenerates the plugin registrant for
      # release mode. `flutter test` above left a debug registrant that still
      # lists dev-only plugins (integration_test), which release builds exclude.
      - name: Build release Android APK (runs R8)
        run: flutter build apk --release

      # The App Bundle is what is uploaded to Play, so build that too and keep
      # its size in check. Raise AAB_BUDGET_MB deliberately, never silently.
      - name: Build release App Bundle and check its size
        env:
          AAB_BUDGET_MB: '95'
        run: |
          flutter build appbundle --release
          size=$(stat -c%s build/app/outputs/bundle/release/app-release.aab)
          mb=$((size / 1024 / 1024))
          echo "app-release.aab: ${mb} MB (budget ${AAB_BUDGET_MB} MB)"
          if [ "$mb" -gt "$AAB_BUDGET_MB" ]; then
            echo "App Bundle exceeds its size budget" >&2
            exit 1
          fi

      # Reports outdated and discontinued packages; informational, because
      # upgrades are done one at a time with device checks.
      - name: Dependency report
        run: flutter pub outdated --no-dev-dependencies || true

  # End-to-end flows on an Android emulator. Not required yet: make it a
  # required check once it has passed reliably for a while.
  integration-android:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test

  visual-windows:
    name: Windows visual baselines
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/features/settings/presentation/screens/settings_golden_test.dart
